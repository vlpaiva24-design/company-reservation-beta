<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1324"><title>Бронь компаний — Beta</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand"><span class="logo">БК</span><div><h1>Бронь компаний <b>BETA</b></h1><p>Единая база для четырёх команд</p></div></div><label class="team">Текущая команда<select id="team"><option value="">Выберите команду</option></select></label></header>
<main><section class="hero"><div><h2>Компании под контролем</h2><p>Найдите компанию по любому параметру и забронируйте без конфликтов.</p></div><button class="primary" id="add">＋ Добавить компанию</button></section>
<section class="toolbar"><label class="search"><span>⌕</span><input id="query" placeholder="Название, ИНН, телефон, адрес, контакт…" autocomplete="off"></label><select id="status"><option value="">Все статусы</option><option value="free">Свободные</option><option value="reserved">Забронированные</option></select><select id="teamFilter"><option value="">Все команды</option></select></section>
<div class="summary" id="summary"></div><section class="grid" id="cards"></section><div class="empty hidden" id="empty"><div>⌕</div><h3>Ничего не найдено</h3><p>Измените запрос или добавьте компанию.</p></div></main>
<div class="toast" id="toast" role="status"></div>
<dialog id="companyDialog"><form id="companyForm"><div class="dialog-head"><div><h2 id="formTitle">Новая компания</h2><p>Поля со звёздочкой обязательны</p></div><button type="button" class="icon close" aria-label="Закрыть">×</button></div><input type="hidden" id="companyId"><div class="form-grid">
<label>Название *<input name="name" required maxlength="500"></label><label>ИНН *<input name="inn" required maxlength="500"></label><label>Юридическая форма<input name="legal_form" maxlength="500" placeholder="ООО, АО…"></label><label>Отрасль<input name="industry" maxlength="500"></label><label>Телефон<input name="phone" maxlength="500"></label><label>Email<input name="email" type="email" maxlength="500"></label><label>Сайт<input name="website" maxlength="500"></label><label>Контактное лицо<input name="contact_person" maxlength="500"></label><label class="wide">Адрес<input name="address" maxlength="500"></label><label class="wide">Комментарий<textarea name="comment" maxlength="5000" rows="3"></textarea></label></div><div class="actions"><button type="button" class="ghost close">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog>
<dialog id="detailDialog"><div id="detail"></div></dialog><script type="module" src="/app.js"></script></body></html>
